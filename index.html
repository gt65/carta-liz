<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti Liz </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    rel="stylesheet">
  <style>
    /* ============================================================
     PERSONALIZA AQUÍ (también hay textos en el JS, al final)
     ============================================================ */
    :root {
      --bg-deep: #241220;
      --bg-deep-2: #3a1c30;
      --paper: #fbf3ea;
      --paper-shadow: #ecdcc9;
      --rose: #c97b84;
      --rose-dark: #7d3c4a;
      --rose-darker: #5c2836;
      --gold: #cba15c;
      --gold-soft: #e4c690;
      --wine: #4a2331;
      --ink: #5c3442;
      --ink-soft: #8a5d6a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background:
        radial-gradient(ellipse at 20% 15%, var(--bg-deep-2) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 85%, #2d1626 0%, transparent 55%),
        var(--bg-deep);
      font-family: 'Lora', serif;
      color: var(--paper);
      position: relative;
    }

    /* ---------- pétalos ambientales ---------- */
    #petals {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -5%;
      opacity: .55;
      animation: fall linear infinite;
      will-change: transform;
    }

    @keyframes fall {
      0% {
        transform: translateY(-8vh) translateX(0) rotate(0deg);
      }

      100% {
        transform: translateY(112vh) translateX(var(--drift)) rotate(340deg);
      }
    }

    /* ---------- escena del sobre ---------- */
    .scene {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 16px;
      transition: opacity .6s ease, filter .6s ease;
      overflow-x: hidden;
    }

    .scene.hidden-scene {
      opacity: 0;
      filter: blur(6px);
      pointer-events: none;
      position: absolute;
      inset: 0;
    }

    .eyebrow {
      font-family: 'Cinzel', serif;
      font-style: normal;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: clamp(.85rem, 2.2vw, 1rem);
      color: #f5dfa0;
      text-align: center;
      text-shadow: 0 0 18px rgba(203, 161, 92, .55), 0 1px 4px rgba(0, 0, 0, .5);
    }

    .envelope-stage {
      position: relative;
      width: min(86vw, 440px);
      max-width: 100%;
    }

    .envelope-stage::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -22px;
      height: 26px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .55), transparent 72%);
      filter: blur(2px);
      z-index: 0;
    }

    .envelope-glow {
      position: absolute;
      inset: -10%;
      background: radial-gradient(circle at 50% 45%, rgba(203, 161, 92, .18), transparent 65%);
      z-index: 0;
      pointer-events: none;
    }

    .envelope {
      position: relative;
      z-index: 1;
      width: 100%;
      aspect-ratio: 3 / 2;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .envelope .back {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(155deg, var(--rose-dark), var(--rose-darker) 70%);
      border-radius: 6px;
      box-shadow:
        0 30px 60px -20px rgba(0, 0, 0, .65),
        0 0 0 1px rgba(228, 198, 144, .15) inset;
    }

    .envelope .stamp {
      position: absolute;
      top: 9%;
      right: 8%;
      width: 15%;
      aspect-ratio: 4/5;
      z-index: 3;
      background: var(--paper);
      border: 2px dashed rgba(124, 60, 74, .35);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .92;
      transform: rotate(4deg);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
    }

    .envelope .stamp svg {
      width: 55%;
      height: 55%;
      fill: var(--rose-dark);
    }

    .envelope .letter-peek {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 5%;
      height: 82%;
      background: var(--paper);
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
      transform: translateY(12%);
      transition: transform .9s cubic-bezier(.6, -0.1, .2, 1.3);
      z-index: 1;
      overflow: hidden;
    }

    .envelope .letter-peek::before {
      content: "";
      position: absolute;
      inset: 10%;
      border: 1px solid rgba(124, 60, 74, .18);
    }

    .envelope .pocket {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(165deg, var(--rose-dark), var(--rose-darker) 80%);
      border-radius: 6px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
    }

    .envelope .pocket::after {
      content: "";
      position: absolute;
      left: 4%;
      right: 4%;
      top: 0;
      height: 64%;
      clip-path: polygon(0 0, 100% 0, 50% 82%);
      background: linear-gradient(rgba(0, 0, 0, .08), transparent 70%);
      pointer-events: none;
    }

    .envelope .flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 62%;
      clip-path: polygon(0 0, 100% 0, 50% 78%);
      background: linear-gradient(200deg, var(--rose), var(--rose-dark) 75%);
      transform-origin: top center;
      transition: transform 1s cubic-bezier(.6, -0.1, .2, 1.15), z-index 0s .5s;
      z-index: 4;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
    }

    .envelope .seal {
      position: absolute;
      top: 44%;
      left: 50%;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%);
      z-index: 5;
      background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 55%, #9a7735 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .4), inset 0 0 0 1px rgba(255, 255, 255, .25);
      transition: transform .5s ease, opacity .5s ease;
      animation: seal-pulse 2.6s ease-in-out infinite;
    }

    .envelope .seal svg {
      width: 26px;
      height: 26px;
      fill: var(--wine);
      opacity: .85;
    }

    .envelope:hover .seal {
      transform: translate(-50%, -50%) scale(1.08);
    }

    @keyframes seal-pulse {

      0%,
      100% {
        box-shadow: 0 6px 14px rgba(0, 0, 0, .4), inset 0 0 0 1px rgba(255, 255, 255, .25), 0 0 0 0 rgba(203, 161, 92, .35);
      }

      50% {
        box-shadow: 0 6px 14px rgba(0, 0, 0, .4), inset 0 0 0 1px rgba(255, 255, 255, .25), 0 0 0 10px rgba(203, 161, 92, 0);
      }
    }

    /* estado abierto */
    .envelope.open .flap {
      transform: rotateX(180deg);
      z-index: 0;
      transition: transform 1s cubic-bezier(.6, -0.1, .2, 1.15), z-index 0s .5s;
    }

    .envelope.open .letter-peek {
      transform: translateY(-46%);
    }

    .envelope.open .seal {
      opacity: 0;
      animation: none;
      transform: translate(-50%, -50%) scale(.4) rotate(25deg);
    }

    /* ---------- efecto de corazones interactivos ---------- */
    .click-heart {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(0.6);
      animation: popHeart 1s ease-out forwards;
    }

    @keyframes popHeart {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6) translateY(0) rotate(0deg);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.3) translateY(-60px) rotate(15deg);
      }
    }

    .hint {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: clamp(1rem, 2.4vw, 1.1rem);
      color: #e8c9d0;
      letter-spacing: .04em;
      text-align: center;
      opacity: 1;
      text-shadow: 0 0 14px rgba(201, 123, 132, .45), 0 1px 4px rgba(0, 0, 0, .5);
    }

    /* ---------- carta completa ---------- */
    .letter-full {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: min(6vh, 48px) 16px 60px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px);
      transition: opacity .7s ease, transform .7s ease;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .letter-full.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .sheet {
      position: relative;
      width: 100%;
      max-width: 620px;
      background:
        radial-gradient(rgba(124, 60, 74, .05) 1px, transparent 1px) 0 0/3px 3px,
        var(--paper);
      color: var(--wine);
      border-radius: 4px;
      padding: clamp(28px, 6vw, 64px) clamp(22px, 7vw, 68px) clamp(40px, 6vw, 56px);
      box-shadow:
        0 40px 80px -30px rgba(0, 0, 0, .7),
        0 0 0 1px rgba(124, 60, 74, .1);
      margin-top: 8px;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .sheet::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(124, 60, 74, .16);
      pointer-events: none;
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: var(--ink-soft);
      font-family: 'Playfair Display', serif;
      font-size: .85rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color .25s ease;
      z-index: 2;
    }

    .close-btn:hover {
      color: var(--rose-darker);
    }

    .close-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
    }

    .ornament {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .ornament svg {
      width: 64px;
      height: 38px;
    }

    .to-line {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-style: normal;
      font-size: clamp(.9rem, 2.6vw, 1.05rem);
      color: var(--ink-soft);
      margin: 0 0 14px;
      letter-spacing: .12em;
      overflow-wrap: break-word;
    }

    .title {
      text-align: center;
      font-family: 'Dancing Script', cursive;
      font-weight: 700;
      font-size: clamp(2.8rem, 10vw, 4rem);
      color: var(--rose-darker);
      margin: 4px 0 28px;
      line-height: 1.1;
      text-shadow: 0 2px 6px rgba(92, 40, 54, .3), 0 1px 0 rgba(255, 255, 255, .4);
      overflow-wrap: break-word;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 0 auto 30px;
      width: 72%;
      color: var(--gold);
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .divider svg {
      width: 16px;
      height: 16px;
      fill: var(--gold);
      flex: none;
    }

    .prose p {
      font-family: 'Lora', serif;
      font-size: clamp(1.05rem, 2.4vw, 1.22rem);
      line-height: 1.85;
      margin: 0 0 22px;
      text-align: left;
      letter-spacing: .015em;
      overflow-wrap: break-word;
    }

    .prose p:first-of-type::first-letter {
      font-family: 'Cinzel', serif;
      font-size: 2.8em;
      float: left;
      line-height: .8;
      padding: 6px 10px 0 0;
      color: var(--rose-darker);
      font-weight: 700;
    }

    .signature-block {
      margin-top: 36px;
      text-align: right;
    }

    .signature-block .con {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--ink-soft);
      margin: 0 0 2px;
    }

    .signature-block .firma {
      font-family: 'Dancing Script', cursive;
      font-weight: 700;
      font-size: clamp(2rem, 6vw, 2.6rem);
      color: var(--rose-darker);
      overflow-wrap: break-word;
    }

    @media (max-width:420px) {
      .signature-block {
        text-align: center;
      }
    }

    .close-btn {
      font-family: 'Cinzel', serif !important;
      letter-spacing: .1em;
    }

    @media (prefers-reduced-motion: reduce) {
      .petal {
        animation: none;
        display: none;
      }

      .envelope .letter-peek,
      .envelope .flap,
      .envelope .seal,
      .letter-full {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div id="petals"></div>

  <!-- ===================== ESCENA: SOBRE ===================== -->
  <div class="scene" id="scene">
    <p class="eyebrow">Un detalle unico para ti</p>

    <div class="envelope-stage">
      <div class="envelope-glow"></div>
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir la carta">
        <div class="back"></div>
        <div class="letter-peek"></div>
        <div class="pocket"></div>
        <div class="flap"></div>
        <div class="stamp">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 21s-8.5-5.36-11-10.36C-.5 6.5 2 3 5.5 3c2 0 3.7 1.1 4.5 2.7C10.8 4.1 12.5 3 14.5 3 18 3 20.5 6.5 19 10.64 15.5 15.36 12 21 12 21z" />
          </svg>
        </div>
        <div class="seal">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 21s-8.5-5.36-11-10.36C-.5 6.5 2 3 5.5 3c2 0 3.7 1.1 4.5 2.7C10.8 4.1 12.5 3 14.5 3 18 3 20.5 6.5 19 10.64 15.5 15.36 12 21 12 21z" />
          </svg>
        </div>
      </div>
    </div>

    <p class="hint">♡ toca el sello para abrir la sorpresa ♡</p>
  </div>

  <!-- ===================== CARTA COMPLETA ===================== -->
  <div class="letter-full" id="letterFull">
    <div class="sheet">
      <button class="close-btn" id="closeBtn" aria-label="Cerrar carta">
        <svg viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
        cerrar
      </button>

      <div class="ornament">
        <!-- ramo pequeño, trazo simple -->
        <svg viewBox="0 0 64 38" fill="none" stroke="#c9a15c" stroke-width="1.2">
          <path d="M32 36V16" />
          <path d="M32 20c-6-2-10-8-8-14 6 0 10 6 8 14z" />
          <path d="M32 20c6-2 10-8 8-14-6 0-10 6-8 14z" />
          <circle cx="18" cy="14" r="5" />
          <circle cx="46" cy="14" r="5" />
          <circle cx="32" cy="8" r="6" />
        </svg>
      </div>

      <p class="to-line" id="toLine"></p>
      <h1 class="title" id="titleLine"></h1>

      <div class="divider">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 21s-8.5-5.36-11-10.36C-.5 6.5 2 3 5.5 3c2 0 3.7 1.1 4.5 2.7C10.8 4.1 12.5 3 14.5 3 18 3 20.5 6.5 19 10.64 15.5 15.36 12 21 12 21z" />
        </svg>
      </div>

      <div class="prose" id="prose"><!-- párrafos insertados por JS --></div>

      <div class="signature-block">
        <p class="con">con todo mi corazon,</p>
        <p class="firma" id="fromLine">tu persona</p>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       PERSONALIZA TU CARTA AQUÍ
       ============================================================ */
    const CONFIG = {
      para: "Para la persona que siempre esta en mi corazon",   // línea pequeña arriba del título
      titulo: "Te Quiero Liz",                               // título grande en letra cursiva
      parrafos: [
        "Desde que llegaste, mi mundo se volvió un lugar más bonito y lleno de tranquilidad. Hay algo en tu manera de ser que me hace sentir feliz, que me llena de alegria en cada momento y eso no lo cambiaría por nada.",
        "Me enamore de ti por que tienes un corazon tan bonito como tu sonrisa, me hace feliz el quererte mucho y me doy cuenta que eres una persona tan maravillosa que me alegra tenerte en mi vida.",
        "Eres la persona con quien quiero compartir cada momento de mi vida y quiero que sepas que eres muy especial para mi. Siempre estaras en mis pensamientos y en mi corazon.",
        "No necesito que el tiempo se detenga para saber que esto es real. Solo sé que cada día que paso contigo es uno que no cambiaría. Gracias por existir, por quedarte, por ser tú.",
        "Nunca te rindas apesar de los problemas que tengamos, yo estaré ahí para ti siempre en cada momento, si caes yo te levanto, si lloras yo te consuelo, si ríes yo rio contigo.",
        "Y si algún día dudas de cuánto te quiero, recuerda que mis palabras son sinceras, que mi cariño es inmenso, y que tú para mí, eres suficiente. Más que suficiente.",
        "Nunca olvides lo mucho que te quiero y lo feliz que me haces cada día. Eres lo más importante para mí y siempre estaré a tu lado para apoyarte, escucharte, quererte y darte todo mi cariño. Te quiero mucho más de lo que las palabras pueden expresar."
      ],
      firma: "De: German"       // cómo firmas la carta
    };

    document.getElementById('toLine').textContent = CONFIG.para;
    document.getElementById('titleLine').textContent = CONFIG.titulo;
    document.getElementById('fromLine').textContent = CONFIG.firma;

    const proseEl = document.getElementById('prose');
    CONFIG.parrafos.forEach(txt => {
      const p = document.createElement('p');
      p.textContent = txt;
      proseEl.appendChild(p);
    });

    /* ---------- interacción del sobre ---------- */
    const envelope = document.getElementById('envelope');
    const scene = document.getElementById('scene');
    const letterFull = document.getElementById('letterFull');
    const closeBtn = document.getElementById('closeBtn');

    function openLetter() {
      envelope.classList.add('open');
      setTimeout(() => {
        scene.classList.add('hidden-scene');
        letterFull.classList.add('visible');
        letterFull.scrollTop = 0;
      }, 700);
    }

    function closeLetter() {
      letterFull.classList.remove('visible');
      setTimeout(() => {
        scene.classList.remove('hidden-scene');
        envelope.classList.remove('open');
      }, 400);
    }

    envelope.addEventListener('click', openLetter);
    envelope.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLetter(); }
    });
    closeBtn.addEventListener('click', closeLetter);

    /* ---------- efecto de corazones interactivos al tocar/clic ---------- */
    document.addEventListener('click', (e) => {
      const heart = document.createElement('div');
      heart.className = 'click-heart';
      heart.style.left = e.clientX + 'px';
      heart.style.top = e.clientY + 'px';
      heart.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#c97b84"/>
      </svg>`;
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    });

    /* ---------- pétalos ambientales ---------- */
    const petalsWrap = document.getElementById('petals');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!reduceMotion) {
      const total = window.innerWidth < 600 ? 10 : 16;
      for (let i = 0; i < total; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        const size = 8 + Math.random() * 10;
        const left = Math.random() * 100;
        const duration = 12 + Math.random() * 14;
        const delay = Math.random() * -20;
        const drift = (Math.random() * 80 - 40) + 'px';
        petal.style.left = left + '%';
        petal.style.setProperty('--drift', drift);
        petal.style.animationDuration = duration + 's';
        petal.style.animationDelay = delay + 's';
        petal.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24">
      <path d="M12 2C7 6 4 10 4 14a8 8 0 0016 0c0-4-3-8-8-12z" fill="#c97b84"/>
    </svg>`;
        petalsWrap.appendChild(petal);
      }
    }
  </script>
</body>

</html>
